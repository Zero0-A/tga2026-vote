<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>组织者后台 · 溯游工作室</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .admin-wrap { max-width: 1120px; margin: auto; padding: clamp(20px, 4vw, 44px) var(--gutter) 55px; }
    .admin-body .topbar { background: var(--paper) url("/brand/suyou-editorial.webp") right 43% / auto 270% no-repeat; }
    .admin-body .topnav a { padding-inline: 10px; background: var(--paper); }
    .admin-body .brand { width: fit-content; max-width: 100%; background: var(--paper); }
    .hidden { display: none !important; }

    .admin-masthead {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px 20px;
      padding: 17px clamp(14px, 3vw, 27px);
      background: var(--paper);
      color: var(--ink);
    }
    .admin-masthead h1 { font-size: clamp(24px, 4vw, 43px); line-height: 1.14; letter-spacing: -.025em; }
    .admin-masthead p { color: #593d73; font-size: 13px; font-variant-numeric: tabular-nums; }
    .admin-actions { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 12px; border-bottom: 1px solid var(--line); }
    .admin-actions .btn:last-child { margin-inline-start: auto; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 6px 13px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }
    .btn:hover:not(:disabled) { border-color: var(--highlight); background: var(--panel); }
    .btn[disabled] { opacity: .55; }
    .btn.danger { border-color: #ff6b7366; color: #ffb2b8; }
    .btn.danger:hover:not(:disabled) { border-color: #ffb2b8; background: #ff6b731c; }

    .login-shell { display: grid; place-items: center; min-height: min(68dvh, 560px); padding: 25px 0; }
    .login-card { width: min(100%, 400px); }
    .login-card h1 { font-size: clamp(33px, 6vw, 52px); line-height: 1.13; letter-spacing: -.035em; }
    .login-card > p { margin: 9px 0 23px; color: var(--muted); font-size: 14px; }
    .login-card label { display: block; margin-bottom: 7px; color: var(--highlight); font-size: 14px; font-weight: 700; }
    .login-card input {
      width: 100%;
      min-height: 46px;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 2px;
      background: var(--paper);
      color: var(--ink);
    }
    .login-card .button-primary { width: 100%; margin-top: 13px; }
    .login-err, .dashboard-notice { color: #ffb2b8; font-size: 13px; }
    .login-err:not(:empty), .dashboard-notice:not(:empty) { margin-top: 10px; }
    .dashboard-notice[data-state="success"] { color: var(--mint); }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-block: 20px 27px;
      padding-block: 16px;
      background: var(--panel);
    }
    .stat-card { min-width: 0; padding-inline: clamp(9px, 3vw, 25px); }
    .stat-card + .stat-card { border-inline-start: 1px solid var(--line); }
    .stat-card .k { color: var(--muted); font-size: 13px; line-height: 1.25; }
    .stat-card .v { margin-top: 7px; color: var(--mint); font: 800 clamp(30px, 5vw, 46px)/.95 var(--display); font-variant-numeric: tabular-nums; }
    .stat-card .v small { color: var(--muted); font-size: .48em; }
    .admin-section { margin-top: 30px; }
    .admin-section h2 { margin-bottom: 9px; padding-bottom: 9px; border-bottom: 1px solid var(--line); font-size: clamp(18px, 2.7vw, 26px); }

    .analytics-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 8px; }
    .analytics-head h2 { flex: 1 1 auto; margin: 0; padding: 0; border: 0; }
    .analytics-note { color: var(--muted); font-size: 12px; }
    .analytics-table { width: 100%; margin-top: 9px; border-collapse: collapse; table-layout: fixed; font-size: clamp(11px, 1.5vw, 13px); font-variant-numeric: tabular-nums; }
    .analytics-table :is(th, td) { padding: 7px clamp(2px, 1.4vw, 14px); border-bottom: 1px solid var(--line); text-align: end; overflow-wrap: anywhere; }
    .analytics-table th:first-child { width: 20%; text-align: start; }
    .analytics-table thead { background: var(--panel); color: var(--highlight); }
    .analytics-table tbody th { font-weight: 650; }
    .analytics-table [data-device="all"] { color: var(--mint); font-weight: 700; }
    .analytics-trend { display: grid; gap: 10px; margin-top: 18px; }
    .analytics-trend h3 { font-size: 17px; }
    .analytics-trend-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
    .analytics-controls { display: flex; flex-wrap: wrap; gap: 6px 10px; }
    .analytics-controls label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .analytics-controls select { max-width: 100%; min-height: 38px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 2px; color: var(--text); background: var(--panel); font: inherit; }
    .analytics-controls select:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
    .analytics-plot { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: clamp(3px, 1.6vw, 16px); padding: 8px 8px 3px; background: var(--panel); }
    .analytics-day { display: grid; grid-template-rows: minmax(0, 1fr) 17px; height: 112px; color: var(--muted); font-size: 11px; text-align: center; }
    .analytics-track { display: flex; min-height: 0; align-items: end; justify-content: center; border-bottom: 1px solid var(--line); }
    .analytics-track i { display: block; width: min(80%, 44px); border-radius: 2px 2px 0 0; background: var(--mint); }
    .analytics-day time { white-space: nowrap; }
    .analytics-daily summary { width: fit-content; min-height: 35px; padding-block: 7px; cursor: pointer; color: var(--highlight); font-size: 13px; }

    .cat-block { border-bottom: 1px solid var(--line); }
    .cat-block-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 20px;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 7px 9px;
      list-style: none;
      cursor: pointer;
    }
    .cat-block-head::-webkit-details-marker { display: none; }
    .cat-block-head:hover, .cat-block[open] > .cat-block-head { background: var(--panel); }
    .cat-block-head :is(.cn, .en) { display: block; overflow-wrap: anywhere; }
    .cat-block-head .cn { font-size: 15px; font-weight: 750; }
    .cat-block-head .en { color: var(--muted); font-size: 11px; }
    .cat-block-head .total { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .cat-block-head .caret { transform: rotate(90deg); transition: transform 160ms ease; }
    .cat-block[open] .caret { transform: rotate(-90deg); }
    .cat-block-body { padding: 0 9px 14px; }
    .res-row { margin-top: 11px; }
    .res-line { display: flex; align-items: center; gap: 9px; font-size: 13px; font-variant-numeric: tabular-nums; }
    .res-line .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .res-line .name span, .res-line .num { color: var(--muted); }
    .res-line .num, .res-line .pct { flex: none; }
    .res-line .pct { min-width: 39px; text-align: right; }
    .res-bar { height: 4px; margin-top: 4px; background: var(--line); }
    .res-bar i { display: block; height: 100%; background: var(--highlight); }
    .res-row.top .res-bar i { background: var(--mint); }

    .recent-row { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); gap: 7px 16px; padding: 9px; border-bottom: 1px solid var(--line); font-size: 13px; }
    .recent-row .t, .recent-row .c { color: var(--muted); }
    .recent-row .t small { display: block; color: var(--dim); }
    .recent-row .n { overflow-wrap: anywhere; font-weight: 650; }
    .empty { padding: 10px 9px; color: var(--muted); font-size: 13px; }
    .admin-maintenance { display: flex; justify-content: flex-end; margin-top: 28px; padding-top: 11px; border-top: 1px solid var(--line); }

    @media (orientation: landscape) and (max-height: 500px) {
      .admin-wrap, .admin-body .topbar-inner {
        padding-inline-start: max(var(--gutter), env(safe-area-inset-left));
        padding-inline-end: max(var(--gutter), env(safe-area-inset-right));
      }
    }

    @media (max-width: 500px) {
      .admin-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .admin-actions .btn:last-child { margin-inline-start: 0; }
      .stat-row { padding-block: 13px; }
      .stat-card .k { font-size: 11px; }
      .recent-row { gap: 5px 8px; padding-inline: 5px; font-size: 12px; }
      .recent-row .c { overflow-wrap: anywhere; }
      .analytics-day time:not(.chart-tick) { visibility: hidden; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cat-block-head .caret { transition: none; }
    }
  </style>
</head>
<body class="admin-body">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark">溯游工作室</span>
        <span class="brand-text" lang="en">SUYO STUDIO</span>
      </a>
      <nav class="topnav" aria-label="后台导航">
        <a href="/">返回票选</a>
      </nav>
    </div>
  </header>

  <main class="admin-wrap">
    <section class="login-shell" id="loginView" aria-labelledby="loginTitle">
      <form class="login-card" id="loginForm">
        <h1 id="loginTitle">后台登录</h1>
        <p>查看本次社团票选的实时统计。</p>
        <label for="passwordInput">管理密码</label>
        <input type="password" id="passwordInput" autocomplete="current-password" required />
        <button class="button-primary" type="submit" id="loginBtn">进入后台</button>
        <p class="login-err" id="loginErr" role="status"></p>
      </form>
    </section>

    <section id="dashView" class="hidden" aria-labelledby="statsTitle">
      <div class="admin-masthead">
        <h1 id="statsTitle" tabindex="-1">投票统计</h1>
        <p id="lastUpdated">加载中…</p>
      </div>
      <div class="admin-actions">
        <button class="btn" type="button" id="refreshBtn">刷新</button>
        <button class="btn" type="button" id="autoBtn" aria-pressed="true">自动刷新：开</button>
        <button class="btn" type="button" id="exportBtn">导出 CSV</button>
        <button class="btn" type="button" id="logoutBtn">退出登录</button>
      </div>
      <p class="dashboard-notice" id="dashboardNotice" role="status"></p>

      <div class="stat-row">
        <div class="stat-card"><div class="k">累计票数</div><div class="v" id="dTotalVotes">--</div></div>
        <div class="stat-card"><div class="k">参与人数</div><div class="v" id="dVoters">--</div></div>
        <div class="stat-card"><div class="k">已有票数的奖项</div><div class="v" id="dCatVoted">--</div></div>
      </div>

      <section class="admin-section" id="analytics" aria-labelledby="analyticsTitle">
        <div class="analytics-head">
          <h2 id="analyticsTitle">访问与投票分析</h2>
          <button class="btn" type="button" id="exportAnalyticsBtn" disabled>导出分析 CSV</button>
        </div>
        <p class="analytics-note" id="analyticsPeriod">等待统计数据。</p>
        <table class="analytics-table" aria-label="各设备访问与投票汇总">
          <thead>
            <tr><th scope="col">设备</th><th scope="col">访问量</th><th scope="col">独立访客</th><th scope="col">投票人数</th><th scope="col">票数</th><th scope="col">转化率</th></tr>
          </thead>
          <tbody id="analyticsSummary"></tbody>
        </table>
        <p class="analytics-note">人数按浏览器去重。转化率为同一统计范围内既访问又投票的浏览器数，占独立访客的比例。</p>
        <div class="analytics-trend">
          <div class="analytics-trend-header">
            <h3>每日趋势 <span class="analytics-note">最近 14 天 · 北京时间</span></h3>
            <div class="analytics-controls">
              <label>设备
                <select id="analyticsDevice">
                  <option value="all">全部设备</option><option value="mobile">移动端</option><option value="desktop">电脑端</option><option value="tablet">平板</option><option value="unknown">未知</option>
                </select>
              </label>
              <label>指标
                <select id="analyticsMetric">
                  <option value="visits">访问量</option><option value="visitors">独立访客</option><option value="voters">投票人数</option><option value="votes">票数</option><option value="conversionRate">转化率</option>
                </select>
              </label>
            </div>
          </div>
          <div class="analytics-plot hidden" id="analyticsPlot" aria-hidden="true"></div>
          <p class="empty hidden" id="analyticsEmpty">暂无该设备的趋势数据。</p>
          <details class="analytics-daily">
            <summary>查看每日明细</summary>
            <table class="analytics-table" aria-label="所选设备的每日访问与投票">
              <thead>
                <tr><th scope="col">日期</th><th scope="col">访问量</th><th scope="col">独立访客</th><th scope="col">投票人数</th><th scope="col">票数</th><th scope="col">转化率</th></tr>
              </thead>
              <tbody id="analyticsDaily"></tbody>
            </table>
          </details>
        </div>
      </section>

      <section class="admin-section" aria-labelledby="awardStatsTitle">
        <h2 id="awardStatsTitle">奖项统计</h2>
        <div id="catList"></div>
      </section>
      <section class="admin-section" aria-labelledby="recentTitle">
        <h2 id="recentTitle">最近投票</h2>
        <div id="recentList"><div class="empty">暂无投票记录</div></div>
      </section>
      <div class="admin-maintenance">
        <button class="btn danger" type="button" id="resetBtn">清空投票数据</button>
      </div>
    </section>
  </main>


  <script>
    (() => {
      const $ = (s) => document.querySelector(s);
      const loginView = $('#loginView');
      const dashView = $('#dashView');
      const notice = $('#dashboardNotice');
      const catList = $('#catList');
      let statsData = null;
      let autoTimer = null;
      let autoOn = true;

      const fmt = (n) => Number(n || 0).toLocaleString('zh-CN');
      const TAB_NAMES = { game: '游戏类', esports: '电竞类', production: '制作类' };
      const DEVICE_NAMES = { all: '全部设备', mobile: '移动端', desktop: '电脑端', tablet: '平板', unknown: '未知' };

      const fmtRate = rate => rate === null ? '—' : rate + '%';

      async function api(url, options = {}) {
        try {
          const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
          const data = await res.json().catch(() => ({}));
          return { ok: res.ok, status: res.status, data };
        } catch {
          return { ok: false, status: 0, data: { error: '网络异常，请重试。' } };
        }
      }

      function showLogin() {
        statsData = null;
        notice.textContent = '';
        loginView.classList.remove('hidden');
        dashView.classList.add('hidden');
        stopAuto();
      }

      function showDash() {
        loginView.classList.add('hidden');
        dashView.classList.remove('hidden');
        if (autoOn) startAuto();
      }

      async function loadStats(silent = false) {
        const { ok, status, data } = await api('/api/admin/stats');
        if (!ok) {
          if (status === 401) {
            showLogin();
            return;
          }
          if (!silent) report('统计加载失败：' + (data.error || '请重试。'));
          return;
        }
        statsData = data;
        render();
        if (dashView.classList.contains('hidden')) showDash();
      }

      function report(message, state = 'error') {
        notice.dataset.state = state;
        notice.textContent = message;
      }

      function analyticsCells(row) {
        return [fmt(row.visits), fmt(row.visitors), fmt(row.voters), fmt(row.votes), fmtRate(row.conversionRate)]
          .map(value => '<td>' + value + '</td>').join('');
      }

      function renderAnalytics(analytics) {
        $('#analytics').classList.toggle('hidden', !analytics);
        if (!analytics) return;
        const period = analytics.since ? '自 ' + analytics.since + ' 起统计（北京时间）。' : '首次访问或投票后开始统计。';
        const legacy = analytics.legacyVotes ? ' 另有 ' + fmt(analytics.legacyVotes) + ' 票缺少设备记录，计入下方奖项统计。' : '';
        $('#analyticsPeriod').textContent = period + legacy;
        $('#analyticsSummary').innerHTML = Object.entries(DEVICE_NAMES).map(([key, name]) =>
          '<tr data-device="' + key + '"><th scope="row">' + name + '</th>' + analyticsCells(analytics.summary[key]) + '</tr>'
        ).join('');
        $('#exportAnalyticsBtn').disabled = !analytics.daily.length;
        renderTrend();
      }

      function renderTrend() {
        const analytics = statsData?.analytics;
        if (!analytics) return;
        const device = $('#analyticsDevice').value;
        const metric = $('#analyticsMetric').value;
        const days = analytics.daily.slice(-14).map(day => ({ date: day.date, row: day.groups[device] }));
        const values = days.map(day => day.row[metric] ?? 0);
        const scale = metric === 'conversionRate' ? 100 : Math.max(1, ...values);
        const hasData = days.some(day => day.row.visits || day.row.votes);
        $('#analyticsEmpty').classList.toggle('hidden', hasData);
        const plot = $('#analyticsPlot');
        plot.classList.toggle('hidden', !hasData);
        plot.innerHTML = days.map(({ date, row }, index) => {
          const tick = index === 0 || index === days.length - 1 || (index % 4 === 0 && index < days.length - 2);
          const label = metric === 'conversionRate' ? fmtRate(row[metric]) : fmt(row[metric]);
          return '<div class="analytics-day" title="' + date + ' · ' + label + '"><div class="analytics-track"><i style="height:' +
            values[index] / scale * 100 + '%"></i></div><time datetime="' + date + '"' +
            (tick ? ' class="chart-tick"' : '') + '>' + date.slice(5) + '</time></div>';
        }).join('');
        $('#analyticsDaily').innerHTML = days.length ? days.reverse().map(({ date, row }) =>
          '<tr><th scope="row"><time datetime="' + date + '">' + date.slice(5) + '</time></th>' + analyticsCells(row) + '</tr>'
        ).join('') : '<tr><td colspan="6">暂无统计数据</td></tr>';
      }

      function render() {
        const d = statsData;
        $('#dTotalVotes').textContent = fmt(d.totalVotes);
        $('#dVoters').textContent = fmt(d.voters);
        const votedCats = d.categories.filter((c) => c.total > 0).length;
        $('#dCatVoted').innerHTML = `${votedCats} <small>/ ${d.categories.length}</small>`;
        $('#lastUpdated').textContent = '最后更新 ' + new Date().toLocaleTimeString('zh-CN');
        renderAnalytics(d.analytics);

        const expandedIds = new Set([...catList.querySelectorAll('details[open]')].map((node) => node.dataset.id));
        const focusedId = document.activeElement.closest('.cat-block-head')?.parentElement.dataset.id;
        catList.innerHTML = d.categories
          .map((c) => {
            const rows = c.nominees
              .map((n, i) => `
                <div class="res-row ${i === 0 && n.votes > 0 ? 'top' : ''}">
                  <div class="res-line">
                    <span class="name"><strong>${n.name}</strong>${n.en && n.en !== n.name ? ` <span lang="en">${n.en}</span>` : ''}</span>
                    <span class="num">${fmt(n.votes)} 票</span>
                    <span class="pct">${n.votes > 0 ? n.pct + '%' : '-'}</span>
                  </div>
                  <div class="res-bar"><i style="width:${n.votes > 0 ? n.pct : 0}%"></i></div>
                </div>`)
              .join('');
            return `
              <details class="cat-block" data-id="${c.id}"${expandedIds.has(c.id) ? ' open' : ''}>
                <summary class="cat-block-head">
                  <span>
                    <span class="cn">${c.cn}</span>
                    <span class="en" lang="en">${c.en}</span>
                  </span>
                  <span class="total">${fmt(c.total)} 票</span>
                  <img class="caret ui-icon" src="/icons/chevron-right.svg" width="18" height="18" alt="" />
                </summary>
                <div class="cat-block-body">${rows || '<div class="empty">暂无提名</div>'}</div>
              </details>`;
          })
          .join('');
        if (focusedId) catList.querySelector('[data-id="' + CSS.escape(focusedId) + '"] summary')?.focus({ preventScroll: true });

        const recentEl = $('#recentList');
        if (d.recent.length === 0) {
          recentEl.innerHTML = '<div class="empty">暂无投票记录</div>';
        } else {
          recentEl.innerHTML = d.recent
            .map((r) => {
              const t = new Date(r.ts);
              const time = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}:${String(t.getSeconds()).padStart(2, '0')}`;
              return `<div class="recent-row"><span class="t">${time}<small>${DEVICE_NAMES[r.device] || '未知'}</small></span><span class="c">${r.category}</span><span class="n">${r.nominee}</span></div>`;
            })
            .join('');
        }
      }

      function startAuto() {
        stopAuto();
        autoTimer = setInterval(() => loadStats(true), 15000);
        $('#autoBtn').textContent = '自动刷新：开';
        $('#autoBtn').setAttribute('aria-pressed', 'true');
      }

      function stopAuto() {
        if (autoTimer) clearInterval(autoTimer);
        autoTimer = null;
        $('#autoBtn').textContent = '自动刷新：关';
        $('#autoBtn').setAttribute('aria-pressed', 'false');
      }

      /* 登录 */
      $('#loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = $('#loginBtn');
        const errEl = $('#loginErr');
        btn.disabled = true;
        btn.textContent = '登录中…';
        errEl.textContent = '';
        const { ok, data } = await api('/api/admin/login', {
          method: 'POST',
          body: JSON.stringify({ password: $('#passwordInput').value })
        });
        btn.disabled = false;
        btn.textContent = '进入后台';
        if (ok) {
          $('#passwordInput').value = '';
          showDash();
          $('#statsTitle').focus({ preventScroll: true });
          await loadStats();
        } else {
          errEl.textContent = data.error || '登录失败';
        }
      });

      $('#logoutBtn').addEventListener('click', async () => {
        const { ok, data } = await api('/api/admin/logout', { method: 'POST' });
        if (ok) {
          showLogin();
          $('#passwordInput').focus();
        } else {
          report(data.error || '退出失败，请重试。');
        }
      });

      $('#refreshBtn').addEventListener('click', () => {
        notice.textContent = '';
        loadStats();
      });

      $('#autoBtn').addEventListener('click', () => {
        autoOn = !autoOn;
        if (autoOn) startAuto(); else stopAuto();
      });

      $('#analyticsDevice').addEventListener('change', renderTrend);
      $('#analyticsMetric').addEventListener('change', renderTrend);

      function downloadCsv(filename, lines) {
        const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        URL.revokeObjectURL(a.href);
      }

      $('#exportAnalyticsBtn').addEventListener('click', () => {
        const analytics = statsData?.analytics;
        if (!analytics) return;
        const lines = ['日期,设备,访问量,独立访客,投票人数,票数,转化率'];
        const periods = [{ date: '累计', groups: analytics.summary }, ...analytics.daily];
        for (const { date, groups } of periods) {
          for (const [device, name] of Object.entries(DEVICE_NAMES)) {
            const row = groups[device];
            lines.push([date, name, row.visits, row.visitors, row.voters, row.votes,
              row.conversionRate === null ? '' : fmtRate(row.conversionRate)].join(','));
          }
        }
        downloadCsv('tga2026-analytics-' + analytics.daily.at(-1).date + '.csv', lines);
      });

      $('#exportBtn').addEventListener('click', () => {
        if (!statsData) return;
        const lines = ['奖项分类,奖项(中文),奖项(英文),提名,票数,占比'];
        statsData.categories.forEach((c) => {
          c.nominees.forEach((n) => {
            lines.push([TAB_NAMES[c.tab] || c.tab, c.cn, c.en, n.name, n.votes, n.votes > 0 ? n.pct + '%' : '0%'].join(','));
          });
        });
        downloadCsv('tga2026-votes-' + new Date().toISOString().slice(0, 10) + '.csv', lines);
      });

      $('#resetBtn').addEventListener('click', async () => {
        if (!confirm('确定要清空全部投票数据吗？此操作不可恢复。')) return;
        if (!confirm('再次确认：所有投票记录将被删除。')) return;
        const { ok } = await api('/api/admin/reset', { method: 'POST', body: '{}' });
        if (ok) {
          await loadStats();
          report('已清空全部投票数据。', 'success');
        } else {
          report('清空失败，请重新登录后再试。');
        }
      });

      loadStats();
    })();
  </script>
</body>
</html>
